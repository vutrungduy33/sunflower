spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sunflower?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: sunflower
    password: sunflower
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

logging:
  level:
    root: info
    com.sunflower.backend: debug

app:
  pay:
    wechat:
      mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:true}
      app-id: ${WECHAT_APP_ID:wx_dev_pay_appid}
      mch-id: ${WECHAT_PAY_MCH_ID:1900000109}
      payment-notify-url: ${WECHAT_PAY_PAYMENT_NOTIFY_URL:https://pay.example.com/api/payments/wechat/transactions/notify}
      refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:https://pay.example.com/api/payments/wechat/refunds/notify}
  auth:
    wechat:
      mock-enabled: ${WECHAT_AUTH_MOCK_ENABLED:true}
      manual-phone-bind-enabled: ${WECHAT_MANUAL_PHONE_BIND_ENABLED:true}
