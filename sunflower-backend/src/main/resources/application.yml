spring:
  application:
    name: sunflower-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  flyway:
    enabled: true
    locations: classpath:db/migration/common

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  media:
    avatar:
      storage-path: ${APP_MEDIA_AVATAR_STORAGE_PATH:./data/uploads/avatars}
  pay:
    wechat:
      mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_PAY_MCH_ID:}
      merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      private-key-content: ${WECHAT_PAY_PRIVATE_KEY_CONTENT:}
      public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      public-key-content: ${WECHAT_PAY_PUBLIC_KEY_CONTENT:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      base-url: ${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}
      payment-notify-url: ${WECHAT_PAY_PAYMENT_NOTIFY_URL:}
      refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}
      currency: ${WECHAT_PAY_CURRENCY:CNY}
      pay-expire-minutes: ${WECHAT_PAY_EXPIRE_MINUTES:15}
      connect-timeout-millis: ${WECHAT_PAY_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${WECHAT_PAY_READ_TIMEOUT_MILLIS:10000}
  admin:
    activation:
      allowlist: ${ADMIN_ACTIVATION_ALLOWLIST:}
    auth:
      token-secret: ${ADMIN_AUTH_TOKEN_SECRET:dev-admin-auth-secret-change-me}
      ttl-seconds: ${ADMIN_AUTH_TOKEN_TTL_SECONDS:28800}
    sms:
      provider: ${ADMIN_SMS_PROVIDER:tencent}
      code-length: ${ADMIN_SMS_CODE_LENGTH:6}
      code-ttl-seconds: ${ADMIN_SMS_CODE_TTL_SECONDS:300}
      resend-cooldown-seconds: ${ADMIN_SMS_RESEND_COOLDOWN_SECONDS:60}
      hourly-send-limit: ${ADMIN_SMS_HOURLY_SEND_LIMIT:5}
      daily-send-limit: ${ADMIN_SMS_DAILY_SEND_LIMIT:10}
      max-verify-attempts: ${ADMIN_SMS_MAX_VERIFY_ATTEMPTS:5}
      login-failure-limit: ${ADMIN_LOGIN_FAILURE_LIMIT:5}
      login-lock-seconds: ${ADMIN_LOGIN_LOCK_SECONDS:900}
      tencent:
        secret-id: ${TENCENT_SMS_SECRET_ID:}
        secret-key: ${TENCENT_SMS_SECRET_KEY:}
        region: ${TENCENT_SMS_REGION:ap-guangzhou}
        sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
        sign-name: ${TENCENT_SMS_SIGN_NAME:}
        activate-template-id: ${TENCENT_SMS_TEMPLATE_ID_ACTIVATE:}
        reset-password-template-id: ${TENCENT_SMS_TEMPLATE_ID_RESET_PASSWORD:}
  auth:
    wechat:
      mock-enabled: ${WECHAT_AUTH_MOCK_ENABLED:false}
      manual-phone-bind-enabled: ${WECHAT_MANUAL_PHONE_BIND_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      jscode2session-url: ${WECHAT_JSCODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      stable-access-token-url: ${WECHAT_STABLE_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/stable_token}
      get-phone-number-url: ${WECHAT_GET_PHONE_NUMBER_URL:https://api.weixin.qq.com/wxa/business/getuserphonenumber}
      mock-fixed-openid: ${WECHAT_MOCK_FIXED_OPENID:}
      mock-openid-prefix: ${WECHAT_MOCK_OPENID_PREFIX:mock_openid_}
      mock-phone-number-prefix: ${WECHAT_MOCK_PHONE_NUMBER_PREFIX:1880000}
    token:
      secret: ${AUTH_TOKEN_SECRET:dev-only-change-me-please}
      ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:7200}
