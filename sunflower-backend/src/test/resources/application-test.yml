spring:
  datasource:
    url: jdbc:h2:mem:sunflower;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/test
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  media:
    avatar:
      storage-path: ./target/test-uploads/avatars
  admin:
    auth:
      token: test-admin-token
  auth:
    wechat:
      mock-enabled: true
      manual-phone-bind-enabled: true
      mock-openid-prefix: mock_openid_
      mock-phone-number-prefix: 1880000
    token:
      secret: test-signing-secret-change-me
      ttl-seconds: 3600
