spring:
  datasource:
    url: jdbc:h2:mem:sunflower;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/test
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  media:
    avatar:
      storage-path: ./target/test-uploads/avatars
  admin:
    activation:
      allowlist: 13100000000:admin,13200000000:admin,13300000000:admin,13400000000:admin,13900000000:operator
    auth:
      token-secret: test-admin-auth-secret-change-me
      ttl-seconds: 3600
    sms:
      provider: fake
      code-length: 6
      code-ttl-seconds: 600
      resend-cooldown-seconds: 60
      hourly-send-limit: 5
      daily-send-limit: 10
      max-verify-attempts: 5
      login-failure-limit: 5
      login-lock-seconds: 900
  auth:
    wechat:
      mock-enabled: true
      manual-phone-bind-enabled: true
      mock-openid-prefix: mock_openid_
      mock-phone-number-prefix: 1880000
    token:
      secret: test-signing-secret-change-me
      ttl-seconds: 3600
