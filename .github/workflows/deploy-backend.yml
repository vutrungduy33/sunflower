name: Deploy Services To ECS

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: auto
        type: choice
        options:
          - auto
          - backend
          - admin-web
          - nginx
          - all
          - bootstrap
      image_tag:
        description: Optional existing GHCR image tag for rollback or redeploy fallback
        required: false
        type: string
      run_seed:
        description: Only used for bootstrap; import scripts/sql/mvp_demo_seed.sql
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deployment_lane:
        description: Validation lane; push-to-main always uses production
        required: true
        default: production
        type: choice
        options:
          - production
          - nonprod-mock-payment
  push:
    branches:
      - main
    paths:
      - "sunflower-backend/**"
      - "sunflower-admin-web/**"
      - "deploy/nginx/**"
      - "docker-compose.backend.yml"
      - "docker-compose.web.yml"
      - ".env.prod.example"
      - ".env.prod.web.example"
      - ".env.empty"
      - "scripts/deploy_*.sh"
      - "scripts/deploy_lib.sh"
      - "scripts/validate_prod_env.sh"
      - "scripts/start_backend_with_mvp_seed.sh"
      - "scripts/start_admin_web.sh"
      - "scripts/reload_host_nginx.sh"
      - "scripts/sync_deploy_bundle.sh"
      - "scripts/execute_runner_deploy.sh"
      - "scripts/sql/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_MAVEN_MIRROR: central

jobs:
  detect-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      deploy_target: ${{ steps.meta.outputs.deploy_target }}
      deployment_lane: ${{ steps.meta.outputs.deployment_lane }}
      run_seed: ${{ steps.meta.outputs.run_seed }}
      backend_changed: ${{ steps.meta.outputs.backend_changed }}
      admin_web_changed: ${{ steps.meta.outputs.admin_web_changed }}
      ingress_changed: ${{ steps.meta.outputs.ingress_changed }}
      should_build_backend: ${{ steps.meta.outputs.should_build_backend }}
      should_build_admin_web: ${{ steps.meta.outputs.should_build_admin_web }}
      deploy_backend_host: ${{ steps.meta.outputs.deploy_backend_host }}
      deploy_web_host: ${{ steps.meta.outputs.deploy_web_host }}
      backend_image: ${{ steps.meta.outputs.backend_image_ref }}
      admin_web_image: ${{ steps.meta.outputs.admin_web_image_ref }}
      backend_artifact_name: ${{ steps.meta.outputs.backend_artifact_name }}
      admin_web_artifact_name: ${{ steps.meta.outputs.admin_web_artifact_name }}
      deploy_bundle_artifact_name: ${{ steps.meta.outputs.deploy_bundle_artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fetch previous revision for diff
        if: github.event_name != 'workflow_dispatch'
        run: |
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$before"
          fi

      - name: Resolve deployment targets
        id: meta
        run: |
          sanitize_tag() {
            printf '%s' "${1:-}" | tr -d '\r\n' | tr -cd '[:alnum:]_.-'
          }

          source_sha="$(git rev-parse --verify HEAD)"
          image_tag="$source_sha"
          requested_target="auto"
          deployment_lane="production"
          run_seed="false"
          manual_image_tag=""

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            requested_target="${{ github.event.inputs.target }}"
            deployment_lane="$(printf '%s' "${{ github.event.inputs.deployment_lane }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            run_seed="$(printf '%s' "${{ github.event.inputs.run_seed }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            manual_image_tag="$(sanitize_tag "${{ github.event.inputs.image_tag }}")"
            if [ -n "$manual_image_tag" ]; then
              image_tag="$manual_image_tag"
            fi
          fi

          case "$deployment_lane" in
            production|nonprod-mock-payment)
              ;;
            *)
              echo "Unsupported deployment lane: $deployment_lane" >&2
              exit 1
              ;;
          esac

          backend_changed=false
          admin_web_changed=false
          ingress_changed=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "$deployment_lane" = "nonprod-mock-payment" ]; then
              case "$requested_target" in
                auto|backend)
                  backend_changed=true
                  ;;
                *)
                  echo "nonprod-mock-payment lane only supports target auto or backend; got $requested_target" >&2
                  exit 1
                  ;;
              esac
            else
              case "$requested_target" in
                auto|all|bootstrap)
                  backend_changed=true
                  admin_web_changed=true
                  ingress_changed=true
                  ;;
                backend)
                  backend_changed=true
                  ;;
                admin-web)
                  admin_web_changed=true
                  ;;
                nginx)
                  ingress_changed=true
                  ;;
                *)
                  echo "Unsupported workflow target: $requested_target" >&2
                  exit 1
                  ;;
              esac
            fi
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git ls-tree -r --name-only HEAD)"
            else
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            fi

            printf '%s\n' "$changed_files"

            if printf '%s\n' "$changed_files" | grep -Eq '^(sunflower-backend/|docker-compose\.backend\.yml$|\.env\.prod\.example$|\.env\.empty$|scripts/deploy_backend\.sh$|scripts/deploy_lib\.sh$|scripts/validate_prod_env\.sh$|scripts/start_backend_with_mvp_seed\.sh$|scripts/sync_deploy_bundle\.sh$|scripts/execute_runner_deploy\.sh$|scripts/sql/|\.github/workflows/deploy-backend\.yml$)'; then
              backend_changed=true
            fi

            if printf '%s\n' "$changed_files" | grep -Eq '^(sunflower-admin-web/|docker-compose\.web\.yml$|\.env\.prod\.web\.example$|\.env\.empty$|scripts/deploy_admin_web\.sh$|scripts/deploy_lib\.sh$|scripts/start_admin_web\.sh$|scripts/sync_deploy_bundle\.sh$|scripts/execute_runner_deploy\.sh$|\.github/workflows/deploy-backend\.yml$)'; then
              admin_web_changed=true
            fi

            if printf '%s\n' "$changed_files" | grep -Eq '^(deploy/nginx/|docker-compose\.web\.yml$|\.env\.prod\.web\.example$|\.env\.empty$|scripts/deploy_prod\.sh$|scripts/bootstrap_prod\.sh$|scripts/deploy_lib\.sh$|scripts/reload_host_nginx\.sh$|scripts/validate_prod_env\.sh$|scripts/sync_deploy_bundle\.sh$|scripts/execute_runner_deploy\.sh$|\.github/workflows/deploy-backend\.yml$)'; then
              ingress_changed=true
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "$requested_target" in
              auto)
                if [ "$deployment_lane" = "nonprod-mock-payment" ]; then
                  deploy_target="backend"
                else
                  deploy_target="all"
                fi
                ;;
              *)
                deploy_target="$requested_target"
                ;;
            esac
          else
            deploy_target="none"
            if [ "$backend_changed" = "true" ] && [ "$admin_web_changed" = "true" ]; then
              deploy_target="all"
            elif [ "$backend_changed" = "true" ]; then
              deploy_target="backend"
            elif [ "$admin_web_changed" = "true" ]; then
              deploy_target="admin-web"
            elif [ "$ingress_changed" = "true" ]; then
              deploy_target="nginx"
            fi
          fi

          should_build_backend=false
          should_build_admin_web=false
          if [ "$backend_changed" = "true" ] && [ -z "$manual_image_tag" ]; then
            should_build_backend=true
          fi
          if [ "$admin_web_changed" = "true" ] && [ -z "$manual_image_tag" ]; then
            should_build_admin_web=true
          fi

          deploy_backend_host=false
          deploy_web_host=false
          case "$deploy_target" in
            backend)
              deploy_backend_host=true
              ;;
            admin-web|nginx)
              deploy_web_host=true
              ;;
            all|bootstrap)
              deploy_backend_host=true
              deploy_web_host=true
              ;;
          esac

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          backend_image_ref=""
          admin_web_image_ref=""
          backend_artifact_name=""
          admin_web_artifact_name=""
          deploy_bundle_artifact_name="deploy-bundle-${source_sha}"

          if [ "$backend_changed" = "true" ]; then
            backend_image_ref="ghcr.io/${owner}/sunflower-backend:${image_tag}"
            backend_artifact_name="backend-image-${image_tag}"
          fi

          if [ "$admin_web_changed" = "true" ]; then
            admin_web_image_ref="ghcr.io/${owner}/sunflower-admin-web:${image_tag}"
            admin_web_artifact_name="admin-web-image-${image_tag}"
          fi

          {
            echo "source_sha=${source_sha}"
            echo "image_tag=${image_tag}"
            echo "deploy_target=${deploy_target}"
            echo "deployment_lane=${deployment_lane}"
            echo "run_seed=${run_seed}"
            echo "backend_changed=${backend_changed}"
            echo "admin_web_changed=${admin_web_changed}"
            echo "ingress_changed=${ingress_changed}"
            echo "should_build_backend=${should_build_backend}"
            echo "should_build_admin_web=${should_build_admin_web}"
            echo "deploy_backend_host=${deploy_backend_host}"
            echo "deploy_web_host=${deploy_web_host}"
            echo "backend_image_ref=${backend_image_ref}"
            echo "admin_web_image_ref=${admin_web_image_ref}"
            echo "backend_artifact_name=${backend_artifact_name}"
            echo "admin_web_artifact_name=${admin_web_artifact_name}"
            echo "deploy_bundle_artifact_name=${deploy_bundle_artifact_name}"
          } >> "${GITHUB_OUTPUT}"

  package-deploy-bundle:
    needs: detect-targets
    if: >-
      ${{
        needs.detect-targets.outputs.deploy_backend_host == 'true' ||
        needs.detect-targets.outputs.deploy_web_host == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout deployment bundle source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .env.empty
            .env.prod.example
            .env.prod.web.example
            .env.nonprod-mock.example
            docker-compose.backend.yml
            docker-compose.web.yml
            deploy/nginx
            scripts
          sparse-checkout-cone-mode: false

      - name: Package deployment bundle artifact
        run: |
          artifact_dir="${RUNNER_TEMP}/deploy-bundle"
          artifact_file="${artifact_dir}/deploy-bundle.tar.gz"
          mkdir -p "$artifact_dir"
          bash scripts/package_deploy_bundle.sh "$artifact_file"

      - name: Upload deployment bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.deploy_bundle_artifact_name }}
          path: ${{ runner.temp }}/deploy-bundle/deploy-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-backend:
    needs: detect-targets
    if: needs.detect-targets.outputs.should_build_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            sunflower-backend

      - name: Resolve backend image tags
        id: image_meta
        run: |
          image_ref="${{ needs.detect-targets.outputs.backend_image }}"
          all_tags="${image_ref}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            all_tags="${all_tags}"$'\n'"${image_ref%:*}:latest"
          fi

          {
            echo "all_tags<<EOF"
            printf '%s\n' "${all_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./sunflower-backend
          push: true
          tags: ${{ steps.image_meta.outputs.all_tags }}
          build-args: |
            MAVEN_MIRROR=${{ env.BACKEND_MAVEN_MIRROR }}
          cache-from: type=gha,scope=sunflower-backend
          cache-to: type=gha,mode=max,scope=sunflower-backend

      - name: Pull backend image for artifact packaging
        run: docker pull "${{ needs.detect-targets.outputs.backend_image }}"

      - name: Export backend image artifact
        run: |
          artifact_dir="${RUNNER_TEMP}/backend-image"
          artifact_file="${artifact_dir}/${{ needs.detect-targets.outputs.backend_artifact_name }}.tar.gz"
          mkdir -p "$artifact_dir"
          docker save "${{ needs.detect-targets.outputs.backend_image }}" | gzip -1 > "$artifact_file"

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.backend_artifact_name }}
          path: ${{ runner.temp }}/backend-image/${{ needs.detect-targets.outputs.backend_artifact_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-admin-web:
    needs: detect-targets
    if: needs.detect-targets.outputs.should_build_admin_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout admin web source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            sunflower-admin-web

      - name: Resolve admin web image tags
        id: image_meta
        run: |
          image_ref="${{ needs.detect-targets.outputs.admin_web_image }}"
          all_tags="${image_ref}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            all_tags="${all_tags}"$'\n'"${image_ref%:*}:latest"
          fi

          {
            echo "all_tags<<EOF"
            printf '%s\n' "${all_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin web image
        uses: docker/build-push-action@v6
        with:
          context: ./sunflower-admin-web
          push: true
          tags: ${{ steps.image_meta.outputs.all_tags }}
          build-args: |
            VITE_APP_TITLE=Sunflower Admin Web
            VITE_API_BASE_URL=/api
            VITE_API_PROXY_TARGET=http://backend:8080
          cache-from: type=gha,scope=sunflower-admin-web
          cache-to: type=gha,mode=max,scope=sunflower-admin-web

      - name: Pull admin web image for artifact packaging
        run: docker pull "${{ needs.detect-targets.outputs.admin_web_image }}"

      - name: Export admin web image artifact
        run: |
          artifact_dir="${RUNNER_TEMP}/admin-web-image"
          artifact_file="${artifact_dir}/${{ needs.detect-targets.outputs.admin_web_artifact_name }}.tar.gz"
          mkdir -p "$artifact_dir"
          docker save "${{ needs.detect-targets.outputs.admin_web_image }}" | gzip -1 > "$artifact_file"

      - name: Upload admin web image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.admin_web_artifact_name }}
          path: ${{ runner.temp }}/admin-web-image/${{ needs.detect-targets.outputs.admin_web_artifact_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  deploy-backend-host:
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.detect-targets.outputs.deploy_backend_host == 'true' &&
        needs.package-deploy-bundle.result == 'success' &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-admin-web.result == 'success' || needs.build-admin-web.result == 'skipped')
      }}
    needs:
      - detect-targets
      - package-deploy-bundle
      - build-backend
      - build-admin-web
    runs-on:
      - self-hosted
      - linux
      - ecs-backend
    permissions:
      actions: read

    steps:
      - name: Download backend deployment bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.deploy_bundle_artifact_name }}
          path: ${{ runner.temp }}/deploy-bundle

      - name: Extract backend deployment bundle
        run: |
          artifact_file="${RUNNER_TEMP}/deploy-bundle/deploy-bundle.tar.gz"
          [ -f "$artifact_file" ] || { echo "Missing deployment bundle artifact: $artifact_file" >&2; exit 1; }
          tar -C "${GITHUB_WORKSPACE}" -xzf "$artifact_file"

      - name: Synchronize backend deployment bundle
        env:
          ECS_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
        run: bash scripts/sync_deploy_bundle.sh "${ECS_DEPLOY_PATH}"

      - name: Download backend image artifact
        if: needs.detect-targets.outputs.should_build_backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.backend_artifact_name }}
          path: ${{ runner.temp }}/backend-image

      - name: Load backend image artifact
        if: needs.detect-targets.outputs.should_build_backend == 'true'
        run: |
          artifact_file="${RUNNER_TEMP}/backend-image/${{ needs.detect-targets.outputs.backend_artifact_name }}.tar.gz"
          [ -f "$artifact_file" ] || { echo "Missing backend artifact: $artifact_file" >&2; exit 1; }
          gzip -dc "$artifact_file" | docker load

      - name: Check backend image availability
        id: backend_image_state
        if: needs.detect-targets.outputs.backend_image != ''
        run: |
          if docker image inspect "${{ needs.detect-targets.outputs.backend_image }}" >/dev/null 2>&1; then
            echo "local=true" >> "${GITHUB_OUTPUT}"
          else
            echo "local=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to GHCR for backend rollback fallback
        if: >-
          ${{
            needs.detect-targets.outputs.should_build_backend != 'true' &&
            needs.detect-targets.outputs.backend_image != '' &&
            steps.backend_image_state.outputs.local != 'true'
          }}
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          [ -n "${GHCR_USERNAME:-}" ] || { echo "Missing GHCR_USERNAME" >&2; exit 1; }
          [ -n "${GHCR_TOKEN:-}" ] || { echo "Missing GHCR_TOKEN" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

      - name: Deploy backend host locally
        timeout-minutes: 20
        env:
          BACKEND_IMAGE: ${{ needs.detect-targets.outputs.backend_image }}
          ADMIN_WEB_IMAGE: ${{ needs.detect-targets.outputs.admin_web_image }}
          SOURCE_SHA: ${{ needs.detect-targets.outputs.image_tag }}
          DEPLOY_TARGET: ${{ needs.detect-targets.outputs.deploy_target }}
          DEPLOYMENT_LANE: ${{ needs.detect-targets.outputs.deployment_lane }}
          RUN_SEED: ${{ needs.detect-targets.outputs.run_seed }}
          DEPLOY_NODE_ROLE: backend
          ECS_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
        run: bash scripts/execute_runner_deploy.sh

  deploy-web-host:
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.detect-targets.outputs.deploy_web_host == 'true' &&
        needs.package-deploy-bundle.result == 'success' &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-admin-web.result == 'success' || needs.build-admin-web.result == 'skipped') &&
        (
          needs.detect-targets.outputs.deploy_backend_host != 'true' ||
          needs.deploy-backend-host.result == 'success'
        )
      }}
    needs:
      - detect-targets
      - package-deploy-bundle
      - build-backend
      - build-admin-web
      - deploy-backend-host
    runs-on:
      - self-hosted
      - linux
      - ecs-web
    permissions:
      actions: read

    steps:
      - name: Download web deployment bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.deploy_bundle_artifact_name }}
          path: ${{ runner.temp }}/deploy-bundle

      - name: Extract web deployment bundle
        run: |
          artifact_file="${RUNNER_TEMP}/deploy-bundle/deploy-bundle.tar.gz"
          [ -f "$artifact_file" ] || { echo "Missing deployment bundle artifact: $artifact_file" >&2; exit 1; }
          tar -C "${GITHUB_WORKSPACE}" -xzf "$artifact_file"

      - name: Synchronize web deployment bundle
        env:
          ECS_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
        run: bash scripts/sync_deploy_bundle.sh "${ECS_DEPLOY_PATH}"

      - name: Download admin web image artifact
        if: needs.detect-targets.outputs.should_build_admin_web == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-targets.outputs.admin_web_artifact_name }}
          path: ${{ runner.temp }}/admin-web-image

      - name: Load admin web image artifact
        if: needs.detect-targets.outputs.should_build_admin_web == 'true'
        run: |
          artifact_file="${RUNNER_TEMP}/admin-web-image/${{ needs.detect-targets.outputs.admin_web_artifact_name }}.tar.gz"
          [ -f "$artifact_file" ] || { echo "Missing admin web artifact: $artifact_file" >&2; exit 1; }
          gzip -dc "$artifact_file" | docker load

      - name: Check admin web image availability
        id: admin_web_image_state
        if: needs.detect-targets.outputs.admin_web_image != ''
        run: |
          if docker image inspect "${{ needs.detect-targets.outputs.admin_web_image }}" >/dev/null 2>&1; then
            echo "local=true" >> "${GITHUB_OUTPUT}"
          else
            echo "local=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to GHCR for admin web rollback fallback
        if: >-
          ${{
            needs.detect-targets.outputs.should_build_admin_web != 'true' &&
            needs.detect-targets.outputs.admin_web_image != '' &&
            steps.admin_web_image_state.outputs.local != 'true'
          }}
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          [ -n "${GHCR_USERNAME:-}" ] || { echo "Missing GHCR_USERNAME" >&2; exit 1; }
          [ -n "${GHCR_TOKEN:-}" ] || { echo "Missing GHCR_TOKEN" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

      - name: Deploy web host locally
        timeout-minutes: 20
        env:
          BACKEND_IMAGE: ${{ needs.detect-targets.outputs.backend_image }}
          ADMIN_WEB_IMAGE: ${{ needs.detect-targets.outputs.admin_web_image }}
          SOURCE_SHA: ${{ needs.detect-targets.outputs.image_tag }}
          DEPLOY_TARGET: ${{ needs.detect-targets.outputs.deploy_target }}
          DEPLOYMENT_LANE: ${{ needs.detect-targets.outputs.deployment_lane }}
          RUN_SEED: ${{ needs.detect-targets.outputs.run_seed }}
          DEPLOY_NODE_ROLE: web
          ECS_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
        run: bash scripts/execute_runner_deploy.sh
