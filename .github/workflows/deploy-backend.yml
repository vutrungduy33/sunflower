name: Deploy Services To ECS

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: auto
        type: choice
        options:
          - auto
          - backend
          - admin-web
          - nginx
          - all
          - bootstrap
      image_tag:
        description: Optional existing GHCR image tag for rollback or redeploy
        required: false
        type: string
      run_seed:
        description: Only used for bootstrap; import scripts/sql/mvp_demo_seed.sql
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - "sunflower-backend/**"
      - "sunflower-admin-web/**"
      - "deploy/nginx/**"
      - "docker-compose.yml"
      - ".env.prod.example"
      - ".env.empty"
      - "scripts/deploy_*.sh"
      - "scripts/deploy_lib.sh"
      - "scripts/validate_prod_env.sh"
      - "scripts/start_backend_with_mvp_seed.sh"
      - "scripts/start_admin_web.sh"
      - "scripts/reload_host_nginx.sh"
      - "scripts/sql/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_MAVEN_MIRROR: central

jobs:
  detect-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      deploy_target: ${{ steps.meta.outputs.deploy_target }}
      run_seed: ${{ steps.meta.outputs.run_seed }}
      backend_changed: ${{ steps.meta.outputs.backend_changed }}
      admin_web_changed: ${{ steps.meta.outputs.admin_web_changed }}
      ingress_changed: ${{ steps.meta.outputs.ingress_changed }}
      should_build_backend: ${{ steps.meta.outputs.should_build_backend }}
      should_build_admin_web: ${{ steps.meta.outputs.should_build_admin_web }}
      backend_image: ${{ steps.meta.outputs.backend_image_ref }}
      admin_web_image: ${{ steps.meta.outputs.admin_web_image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fetch previous revision for diff
        if: github.event_name != 'workflow_dispatch'
        run: |
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$before"
          fi

      - name: Resolve deployment targets
        id: meta
        run: |
          sanitize_tag() {
            printf '%s' "${1:-}" | tr -d '\r\n' | tr -cd '[:alnum:]_.-'
          }

          source_sha="$(git rev-parse --verify HEAD)"
          image_tag="$source_sha"
          requested_target="auto"
          run_seed="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            requested_target="${{ github.event.inputs.target }}"
            run_seed="$(printf '%s' "${{ github.event.inputs.run_seed }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            manual_image_tag="$(sanitize_tag "${{ github.event.inputs.image_tag }}")"
            if [ -n "$manual_image_tag" ]; then
              image_tag="$manual_image_tag"
            fi
          fi

          backend_changed=false
          admin_web_changed=false
          ingress_changed=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "$requested_target" in
              auto|all|bootstrap)
                backend_changed=true
                admin_web_changed=true
                ingress_changed=true
                ;;
              backend)
                backend_changed=true
                ;;
              admin-web)
                admin_web_changed=true
                ;;
              nginx)
                ingress_changed=true
                ;;
              *)
                echo "Unsupported workflow target: $requested_target" >&2
                exit 1
                ;;
            esac
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git ls-tree -r --name-only HEAD)"
            else
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            fi

            printf '%s\n' "$changed_files"

            if printf '%s\n' "$changed_files" | grep -Eq '^(sunflower-backend/|docker-compose\.yml$|\.env\.prod\.example$|\.env\.empty$|scripts/deploy_backend\.sh$|scripts/deploy_lib\.sh$|scripts/validate_prod_env\.sh$|scripts/start_backend_with_mvp_seed\.sh$|scripts/sql/|\.github/workflows/deploy-backend\.yml$)'; then
              backend_changed=true
            fi

            if printf '%s\n' "$changed_files" | grep -Eq '^(sunflower-admin-web/|docker-compose\.yml$|\.env\.prod\.example$|\.env\.empty$|scripts/deploy_admin_web\.sh$|scripts/deploy_lib\.sh$|scripts/start_admin_web\.sh$|\.github/workflows/deploy-backend\.yml$)'; then
              admin_web_changed=true
            fi

            if printf '%s\n' "$changed_files" | grep -Eq '^(deploy/nginx/|docker-compose\.yml$|\.env\.prod\.example$|\.env\.empty$|scripts/deploy_prod\.sh$|scripts/bootstrap_prod\.sh$|scripts/deploy_lib\.sh$|scripts/reload_host_nginx\.sh$|scripts/validate_prod_env\.sh$|\.github/workflows/deploy-backend\.yml$)'; then
              ingress_changed=true
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "$requested_target" in
              auto)
                deploy_target="all"
                ;;
              *)
                deploy_target="$requested_target"
                ;;
            esac
          else
            deploy_target="none"
            if [ "$backend_changed" = "true" ] && [ "$admin_web_changed" = "true" ]; then
              deploy_target="all"
            elif [ "$backend_changed" = "true" ]; then
              deploy_target="backend"
            elif [ "$admin_web_changed" = "true" ]; then
              deploy_target="admin-web"
            elif [ "$ingress_changed" = "true" ]; then
              deploy_target="nginx"
            fi
          fi

          should_build_backend=false
          should_build_admin_web=false
          if [ "$backend_changed" = "true" ] && [ -z "${manual_image_tag:-}" ]; then
            should_build_backend=true
          fi
          if [ "$admin_web_changed" = "true" ] && [ -z "${manual_image_tag:-}" ]; then
            should_build_admin_web=true
          fi

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          backend_image_ref=""
          admin_web_image_ref=""

          if [ "$backend_changed" = "true" ]; then
            backend_image_ref="ghcr.io/${owner}/sunflower-backend:${image_tag}"
          fi

          if [ "$admin_web_changed" = "true" ]; then
            admin_web_image_ref="ghcr.io/${owner}/sunflower-admin-web:${image_tag}"
          fi

          {
            echo "source_sha=${source_sha}"
            echo "image_tag=${image_tag}"
            echo "deploy_target=${deploy_target}"
            echo "run_seed=${run_seed}"
            echo "backend_changed=${backend_changed}"
            echo "admin_web_changed=${admin_web_changed}"
            echo "ingress_changed=${ingress_changed}"
            echo "should_build_backend=${should_build_backend}"
            echo "should_build_admin_web=${should_build_admin_web}"
            echo "backend_image_ref=${backend_image_ref}"
            echo "admin_web_image_ref=${admin_web_image_ref}"
          } >> "${GITHUB_OUTPUT}"

  build-backend:
    needs: detect-targets
    if: needs.detect-targets.outputs.should_build_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            sunflower-backend

      - name: Resolve backend image tags
        id: image_meta
        run: |
          image_ref="${{ needs.detect-targets.outputs.backend_image }}"
          all_tags="${image_ref}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            all_tags="${all_tags}"$'\n'"${image_ref%:*}:latest"
          fi

          {
            echo "all_tags<<EOF"
            printf '%s\n' "${all_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./sunflower-backend
          push: true
          tags: ${{ steps.image_meta.outputs.all_tags }}
          build-args: |
            MAVEN_MIRROR=${{ env.BACKEND_MAVEN_MIRROR }}
          cache-from: type=gha,scope=sunflower-backend
          cache-to: type=gha,mode=max,scope=sunflower-backend

  build-admin-web:
    needs: detect-targets
    if: needs.detect-targets.outputs.should_build_admin_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout admin web source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            sunflower-admin-web

      - name: Resolve admin web image tags
        id: image_meta
        run: |
          image_ref="${{ needs.detect-targets.outputs.admin_web_image }}"
          all_tags="${image_ref}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            all_tags="${all_tags}"$'\n'"${image_ref%:*}:latest"
          fi

          {
            echo "all_tags<<EOF"
            printf '%s\n' "${all_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin web image
        uses: docker/build-push-action@v6
        with:
          context: ./sunflower-admin-web
          push: true
          tags: ${{ steps.image_meta.outputs.all_tags }}
          build-args: |
            VITE_APP_TITLE=Sunflower Admin Web
            VITE_API_BASE_URL=/api
            VITE_API_PROXY_TARGET=http://backend:8080
          cache-from: type=gha,scope=sunflower-admin-web
          cache-to: type=gha,mode=max,scope=sunflower-admin-web

  deploy:
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.detect-targets.outputs.deploy_target != 'none' &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-admin-web.result == 'success' || needs.build-admin-web.result == 'skipped')
      }}
    needs:
      - detect-targets
      - build-backend
      - build-admin-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment bundle source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .env.empty
            .env.prod.example
            docker-compose.yml
            deploy/nginx
            scripts
          sparse-checkout-cone-mode: false

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          port: ${{ secrets.ECS_PORT }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          port: ${{ secrets.ECS_PORT }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_SSH_PASSPHRASE }}
          source: .env.empty,.env.prod.example,docker-compose.yml,deploy/nginx/sunflower-host.conf.template,scripts
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.detect-targets.outputs.backend_image }}
          ADMIN_WEB_IMAGE: ${{ needs.detect-targets.outputs.admin_web_image }}
          SOURCE_SHA: ${{ needs.detect-targets.outputs.image_tag }}
          DEPLOY_TARGET: ${{ needs.detect-targets.outputs.deploy_target }}
          RUN_SEED: ${{ needs.detect-targets.outputs.run_seed }}
          ECS_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          port: ${{ secrets.ECS_PORT }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_SSH_PASSPHRASE }}
          envs: BACKEND_IMAGE,ADMIN_WEB_IMAGE,SOURCE_SHA,DEPLOY_TARGET,RUN_SEED,ECS_DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu

            sanitize_line() {
              printf '%s' "${1:-}" | tr -d '\r\n'
            }

            sanitize_image_ref() {
              printf '%s' "${1:-}" | tr -d '\r\n' | tr -cd '[:alnum:]._:/-'
            }

            BACKEND_IMAGE="$(sanitize_image_ref "${BACKEND_IMAGE:-}")"
            ADMIN_WEB_IMAGE="$(sanitize_image_ref "${ADMIN_WEB_IMAGE:-}")"
            SOURCE_SHA="$(sanitize_line "${SOURCE_SHA:-}")"
            DEPLOY_TARGET="$(sanitize_line "${DEPLOY_TARGET:-}")"
            RUN_SEED="$(sanitize_line "${RUN_SEED:-false}")"
            DEPLOY_PATH="$(sanitize_line "${ECS_DEPLOY_PATH:-}")"
            GHCR_USERNAME="$(sanitize_line "${GHCR_USERNAME:-}")"
            GHCR_TOKEN="$(sanitize_line "${GHCR_TOKEN:-}")"

            [ -n "$SOURCE_SHA" ] || { echo "Missing SOURCE_SHA"; exit 1; }
            [ -n "$DEPLOY_TARGET" ] || { echo "Missing DEPLOY_TARGET"; exit 1; }
            [ -n "$DEPLOY_PATH" ] || { echo "Missing DEPLOY_PATH"; exit 1; }

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            [ -f docker-compose.yml ] || { echo "Missing docker-compose.yml after upload"; exit 1; }
            [ -f scripts/validate_prod_env.sh ] || { echo "Missing deploy scripts after upload"; exit 1; }
            printf '%s\n' "$SOURCE_SHA" > .deploy-source-sha

            cat > .release.env <<EOF
            BACKEND_IMAGE=$BACKEND_IMAGE
            ADMIN_WEB_IMAGE=$ADMIN_WEB_IMAGE
            SOURCE_SHA=$SOURCE_SHA
            DEPLOY_TARGET=$DEPLOY_TARGET
            RUN_SEED=$RUN_SEED
            EOF

            chmod +x scripts/*.sh
            ./scripts/validate_prod_env.sh

            if [ -n "$BACKEND_IMAGE" ] || [ -n "$ADMIN_WEB_IMAGE" ]; then
              [ -n "$GHCR_USERNAME" ] || { echo "Missing GHCR_USERNAME"; exit 1; }
              [ -n "$GHCR_TOKEN" ] || { echo "Missing GHCR_TOKEN"; exit 1; }
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            if [ "$DEPLOY_TARGET" = "bootstrap" ]; then
              ./scripts/bootstrap_prod.sh
            else
              ./scripts/deploy_prod.sh "$DEPLOY_TARGET"
            fi
