x-runtime-env-files: &runtime_env_files
  - ${PROD_ENV_FILE:-.env.prod}
  - ${RELEASE_ENV_FILE:-.env.empty}

services:
  mysql:
    image: mysql:8.0
    container_name: sunflower-mysql
    restart: unless-stopped
    env_file: *runtime_env_files
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - sunflower_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-sunflower-backend:local}
    build:
      context: ./sunflower-backend
      dockerfile: Dockerfile
    container_name: sunflower-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: *runtime_env_files
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - sunflower_backend_uploads:/app/data/uploads/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sunflower_backend_uploads:
  sunflower_mysql_data:
